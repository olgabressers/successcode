<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Мое Пространство Успеха · SuccessCode</title>
<link rel="alternate" hreflang="en" href="https://successcode.net/myspace">
<link rel="alternate" hreflang="ru" href="https://successcode.net/ru/myspace">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root{
    --black:#f5f3ee; --surface:#ffffff; --surface2:#e7e6e2; --card:#e7e6e2;
    --gold:#b8882a; --gold2:#8a6410; --gold-dim:rgba(184,144,58,0.10);
    --white:#1a1a1a; --dim:#555555; --muted:#8a8578; --border:#d8d4c8;
    --field:#f8f6f2; --line:rgba(0,0,0,0.08);
  }
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html{ scroll-behavior:smooth; }
  html,body{ max-width:100vw; overflow-x:hidden; position:relative; }
  body{ font-family:'Inter',sans-serif; background:var(--black); color:var(--white); -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }

  /* NAV — matches site template */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:200;
    padding:22px 56px; display:flex; justify-content:space-between; align-items:center; gap:16px;
    background:rgba(255,255,255,0.97); border-bottom:1px solid var(--border); backdrop-filter:blur(8px);
  }
  .nav-logo{ font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:700; letter-spacing:5px; text-transform:uppercase; color:var(--gold); text-decoration:none; }
  .nav-sections{ display:flex; gap:18px; align-items:center; margin-left:auto; flex-wrap:nowrap; }
  .nav-links{ display:flex; gap:12px; align-items:center; }
  .nav-link{ font-size:11px; letter-spacing:1.2px; text-transform:uppercase; white-space:nowrap; color:var(--white); font-weight:600; text-decoration:none; transition:color .25s; }
  .nav-link:hover,.nav-link.on{ color:var(--gold2); }
  .nav-btn{ font-size:12px; letter-spacing:2px; text-transform:uppercase; font-weight:600; color:#f5f1eb; background:var(--gold); padding:12px 26px; text-decoration:none; transition:background .25s; border:0; cursor:pointer; }
  .nav-btn:hover{ background:var(--gold2); }
  .lang-switch{ display:inline-flex; align-items:center; border:1px solid var(--border); }
  .lang-switch a{ font-size:11px; letter-spacing:2px; font-weight:600; color:var(--muted); padding:8px 12px; text-decoration:none; transition:background .2s,color .2s; }
  .lang-switch a.active{ background:var(--gold); color:#f5f1eb; }
  .lang-switch a:not(.active):hover{ color:var(--gold2); }

  main{ max-width:1080px; margin:0 auto; padding:150px 56px 110px; }

  .page-head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:40px; }
  .eyebrow{ font-size:12px; letter-spacing:4px; text-transform:uppercase; color:var(--gold2); margin-bottom:14px; }
  h1.disp{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:52px; line-height:1.05; letter-spacing:.5px; }
  .lead{ color:var(--dim); font-size:15px; line-height:1.6; margin-top:14px; max-width:560px; }
  .acct{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted); }
  .acct button{ background:transparent; border:1px solid var(--border); color:var(--white); padding:9px 16px; cursor:pointer; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; transition:background .2s,color .2s; }
  .acct button:hover{ background:var(--gold); color:#f5f1eb; border-color:var(--gold); }

  /* AUTH */
  .auth{ max-width:430px; margin:0 auto; background:var(--surface); border:1px solid var(--border); padding:34px 32px 30px; }
  .tabs{ display:flex; gap:0; margin-bottom:26px; border:1px solid var(--border); }
  .tabs button{ flex:1; border:0; background:transparent; padding:13px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; color:var(--muted); font-weight:600; transition:background .2s,color .2s; }
  .tabs button.on{ background:var(--gold); color:#f5f1eb; }
  label{ display:block; font-size:11px; letter-spacing:1.5px; color:var(--muted); margin:18px 0 7px; text-transform:uppercase; font-weight:600; }
  input{ width:100%; padding:13px 15px; border:1px solid var(--border); background:var(--field); color:var(--white); font-size:15px; outline:none; font-family:inherit; }
  input::placeholder{ color:#8f92a3; }
  input:focus{ border-color:var(--gold2); }
  .btn{ width:100%; margin-top:26px; background:var(--gold); color:#f5f1eb; border:0; padding:15px; font-size:12px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; font-weight:600; transition:background .25s; }
  .btn:hover{ background:var(--gold2); }
  .msg{ margin-top:16px; font-size:13px; color:#c0392b; min-height:18px; text-align:center; }
  .hint{ font-size:13px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.6; }
  .pw{ position:relative; }
  .pw input{ padding-right:46px; }
  .eye{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; border:0; cursor:pointer; font-size:18px; line-height:1; padding:4px 6px; opacity:.65; }
  .eye:hover{ opacity:1; }

  /* GRID */
  .grid{ display:block; }
  .sec{ margin-bottom:44px; }
  .sec-h{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:600; color:var(--white); margin:0 0 18px; padding-bottom:8px; border-bottom:2px solid var(--gold); }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px; }
  .openbtn{ margin-top:6px; background:var(--gold); color:#fff; border:0; padding:9px 24px; font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:600; cursor:pointer; border-radius:6px; font-family:inherit; }
  .openbtn:hover{ background:var(--gold2); }
  .pur-price{ font-size:30px; font-weight:700; color:var(--gold2); font-family:'Cormorant Garamond',serif; margin-bottom:8px; }
  .tile{ position:relative; background:var(--card); border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; min-height:230px; transition:transform .18s,box-shadow .18s,border-color .18s; }
  .tile.open{ cursor:pointer; }
  .tile.open:hover{ transform:translateY(-4px); box-shadow:0 14px 32px rgba(0,0,0,.14); border-color:var(--gold); }
  .tile .art{ height:138px; background:linear-gradient(135deg,#dedcd6,#e7e6e2); display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--border); }
  .tile .art img{ width:100%; height:100%; object-fit:cover; }
  .tile .art .mono{ font-size:40px; color:var(--gold2); }
  .tile .body{ padding:18px 18px 20px; flex:1; display:flex; flex-direction:column; }
  .tile .name{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; line-height:1.2; margin-bottom:10px; }
  .tile .meta{ margin-top:auto; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; justify-content:space-between; }
  .open-tag{ color:var(--gold2); font-weight:600; }
  .tile.locked{ background:linear-gradient(155deg,#e0dfda,#e7e6e2); }
  .lockcard{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px 20px; gap:12px; min-height:230px; }
  .lockcard .ln{ font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; line-height:1.2; color:var(--white); }
  .lockcard .li{ font-size:26px; color:var(--gold2); opacity:.85; }
  .lockcard .lp{ font-size:26px; font-weight:700; color:var(--gold2); font-family:'Cormorant Garamond',serif; }
  .lockcard .badge{ font-size:14px; font-weight:600; letter-spacing:2px; text-transform:uppercase; font-family:'Inter',sans-serif; }
  .lockcard .ls{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }

  /* ITEM */
  .back{ background:transparent; border:0; color:var(--gold2); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; cursor:pointer; padding:0; margin-bottom:24px; }
  .item{ background:var(--surface); border:1px solid var(--border); padding:36px 34px; }
  .item h2{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:34px; margin-bottom:22px; }
  .item .content{ color:var(--dim); font-size:15px; line-height:1.7; }
  .item .content img,.item .content iframe{ max-width:100%; }
  .item .content a{ color:var(--gold2); }
  .empty{ color:var(--muted); font-size:14px; }

  .spin{ text-align:center; color:var(--muted); padding:60px; font-size:14px; }

  .back-to-top{ position:fixed; right:22px; bottom:22px; width:52px; height:52px; background:var(--gold); color:#f5f1eb; display:none; align-items:center; justify-content:center; text-decoration:none; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50; }
  .back-to-top svg{ width:22px; height:22px; }

  @media (max-width:768px){
    *{ max-width:100vw; } img,iframe{ max-width:100% !important; }
    nav{ padding:10px 14px 8px; gap:8px; flex-wrap:wrap; }
    .nav-logo{ font-size:13px; letter-spacing:2px; white-space:nowrap; flex-shrink:0; }
    .nav-sections{ order:3; flex:1 0 100%; margin:0; gap:8px 12px; flex-wrap:wrap; justify-content:center; border-top:1px solid var(--border); padding-top:8px; }
    .nav-links{ gap:8px; flex-shrink:0; }
    .nav-link{ font-size:11px; letter-spacing:.6px; }
    .nav-btn{ padding:8px 12px; font-size:10px; letter-spacing:1px; white-space:nowrap; }
    .lang-switch a{ padding:6px 8px; font-size:10px; letter-spacing:1px; }
    main{ padding:118px 18px 80px; }
    h1.disp{ font-size:38px; }
    .tiles{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
    .sec-h{ font-size:21px; }
    .back-to-top{ width:46px; height:46px; }
  }
</style>
</head>
<body>
<nav>
  <a href="/ru/" class="nav-logo">SuccessCode</a>
  <div class="nav-sections">
    <a href="/ru/" class="nav-link">Главная</a>
    <a href="/calculators?lang=ru" class="nav-link">Калькуляторы</a>
    <a href="/calendar" class="nav-link">Календарь</a>
    <a href="/walks" class="nav-link">Прогулки</a>
    <a href="/training" class="nav-link">Обучение</a>
    <a href="/2027" class="nav-link">Подготовка к 2027</a>
    <a href="/businessastrology" class="nav-link">Достижение цели</a>
    <a href="/ru/myspace" class="nav-link on">Войти</a>
  </div>
  <div class="nav-links">
    <div class="lang-switch" aria-label="Язык">
      <a href="/ru/myspace" class="active">RU</a>
      <a href="/myspace">EN</a>
    </div>
    <a href="/ru/#booking" class="nav-btn">Записаться</a>
  </div>
</nav>

<main>
  <div class="page-head">
    <div>
      <p class="eyebrow">SuccessCode</p>
      <h1 class="disp">Мое Пространство Успеха</h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="acct" id="who" hidden>
      <span id="who-email"></span>
      <button id="logout">Выйти</button>
    </div>
  </div>

  <!-- AUTH -->
  <section id="auth" class="auth" hidden>
    <div class="tabs">
      <button id="tab-login" class="on" type="button">Вход</button>
      <button id="tab-reg" type="button">Регистрация</button>
    </div>
    <form id="form">
      <div id="reg-top" hidden>
        <label>Имя</label>
        <input id="first_name" type="text" autocomplete="given-name">
        <label>Фамилия</label>
        <input id="last_name" type="text" autocomplete="family-name">
      </div>
      <label>Почта</label>
      <input id="email" type="email" autocomplete="off" autocapitalize="off" autocorrect="off" required>
      <label>Пароль</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="new-password" minlength="6" required>
        <button type="button" class="eye" id="eye1" aria-label="Показать пароль">👁</button>
      </div>
      <div id="confirm-wrap" hidden>
        <label>Повторите пароль</label>
        <div class="pw">
          <input id="password2" type="password" autocomplete="new-password" minlength="6">
          <button type="button" class="eye" id="eye2" aria-label="Показать пароль">👁</button>
        </div>
      </div>
      <button class="btn" id="submit" type="submit">Войти</button>
      <div class="msg" id="msg"></div>
      <div class="hint" id="hint">Введите почту и пароль, чтобы войти.</div>
    </form>
  </section>

  <!-- CABINET -->
  <section id="cabinet" hidden>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ITEM -->
  <section id="item" hidden>
    <button class="back" id="item-back" type="button">← Назад</button>
    <div class="item">
      <h2 id="item-title"></h2>
      <div class="content" id="item-content"></div>
    </div>
  </section>

  <!-- PURCHASE REQUEST -->
  <section id="purchase" hidden>
    <button class="back" id="pur-back" type="button">← Назад</button>
    <div class="item">
      <h2 id="pur-title"></h2>
      <div class="content">
        <p id="pur-price" class="pur-price"></p>
        <p style="font-size:15px;line-height:1.7;color:var(--dim)">Оставьте заявку — мы свяжемся с вами, чтобы принять оплату и открыть доступ.</p>
        <button class="btn" id="pur-send" type="button" style="margin-top:6px">Отправить заявку</button>
        <div class="msg" id="pur-msg" style="margin-top:14px"></div>
      </div>
    </div>
  </section>

  <div id="loading" class="spin">Загрузка…</div>
</main>

<a href="#" class="back-to-top" id="backToTop" aria-label="Наверх"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg></a>

<script>
const API="https://kabinet-api.vercel.app";
const AT="sc_kab_at", RT="sc_kab_rt";
const $=id=>document.getElementById(id);
const show=(id,on)=>{ $(id).hidden=!on; };
let MODE="login";

function token(){ try{ return localStorage.getItem(AT); }catch(e){ return null; } }
function setTokens(j){ try{ if(j.access_token) localStorage.setItem(AT,j.access_token); if(j.refresh_token) localStorage.setItem(RT,j.refresh_token); }catch(e){} }
function clearTokens(){ try{ localStorage.removeItem(AT); localStorage.removeItem(RT); }catch(e){} }

async function api(path, opts){
  opts=opts||{}; opts.headers=Object.assign({"content-type":"application/json"}, opts.headers||{});
  const t=token(); if(t) opts.headers.authorization="Bearer "+t;
  const r=await fetch(API+path, opts);
  let data={}; try{ data=await r.json(); }catch(e){}
  return { ok:r.ok, status:r.status, data };
}

// ---- auth screen ----
function setMode(m){
  MODE=m;
  $("tab-login").classList.toggle("on", m==="login");
  $("tab-reg").classList.toggle("on", m==="reg");
  $("submit").textContent = m==="login" ? "Войти" : "Создать аккаунт";
  $("password").setAttribute("autocomplete", "new-password");
  $("confirm-wrap").hidden = (m!=="reg"); $("password2").value="";
  $("reg-top").hidden = (m!=="reg");
  $("hint").textContent = m==="login"
    ? "Введите почту и пароль, чтобы войти."
    : "Придумайте пароль (минимум 6 символов). Мы пришлём письмо со ссылкой для подтверждения почты.";
  $("msg").textContent="";
}
$("tab-login").onclick=()=>setMode("login");
$("tab-reg").onclick=()=>setMode("reg");
function bindEye(btnId,inputId){ const b=$(btnId), i=$(inputId); if(!b||!i) return; b.onclick=()=>{ const show=i.type==="password"; i.type=show?"text":"password"; b.textContent=show?"🙈":"👁"; b.setAttribute("aria-label", show?"Скрыть пароль":"Показать пароль"); }; }
bindEye("eye1","password"); bindEye("eye2","password2");
// Clear any browser-autofilled login on load so a saved address isn't pre-shown.
try{ $("email").value=""; $("password").value=""; if($("password2")) $("password2").value=""; }catch(e){}

$("form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email=$("email").value.trim(), password=$("password").value;
  const first_name=$("first_name").value.trim(), last_name=$("last_name").value.trim();
  if(!email||!password) return;
  if(MODE==="reg"){
    if(!first_name||!last_name){ $("msg").textContent="Укажите имя и фамилию."; return; }
    if(password !== $("password2").value){ $("msg").textContent="Пароли не совпадают."; return; }
  }
  $("submit").disabled=true; $("msg").textContent="";
  const path = MODE==="login" ? "/api/login" : "/api/register";
  const body = MODE==="reg" ? {email,password,first_name,last_name,redirect:location.pathname} : {email,password};
  const { ok, data } = await api(path, { method:"POST", body:JSON.stringify(body) });
  $("submit").disabled=false;
  if(ok && data.access_token){ setTokens(data); route(); }
  else if(ok && data.confirm_required){
    $("form").innerHTML = '<p class="hint" style="color:var(--dim);font-size:15px;line-height:1.7">Мы отправили письмо для подтверждения на <b style="color:var(--white)">'+email+'</b>.<br><br>Откройте письмо и перейдите по ссылке, чтобы подтвердить почту — затем вернитесь сюда и войдите. Если письма нет, проверьте папку «Спам».</p>';
  }
  else {
    const err = data.error_description || data.msg || data.error || "Не получилось. Проверьте почту и пароль.";
    $("msg").textContent = MODE==="login" && /invalid/i.test(err) ? "Неверная почта или пароль."
      : (/not confirmed|подтвержд/i.test(err) ? "Почта не подтверждена. Откройте ссылку в письме, затем войдите." : err);
  }
});

$("logout").onclick=()=>{ clearTokens(); route(); };

// ---- cabinet ----
const SECTIONS=[
  ["walks","Волшебные прогулки"],
  ["calendar","Календарь Успешных дат"],
  ["yearly","Код Успеха Каждого Года"],
  ["free","Бесплатно"],
];
let PRODS=[];
const fmtEur=v=>{ const n=Number(v); return Number.isInteger(n)?String(n):n.toFixed(2); };
const fmtPrice=v=>`€${fmtEur(v)} (₽${Math.round(Number(v)*100)})`;
async function loadCabinet(){
  show("auth",false); show("item",false); show("purchase",false); show("cabinet",false); show("loading",true);
  const { ok, status, data } = await api("/api/cabinet");
  if(status===401){ clearTokens(); return route(); }
  show("loading",false);
  if(!ok){ show("auth",true); return; }
  $("who-email").textContent = data.name ? (data.name+" · "+(data.email||"")) : (data.email||""); show("who",true);
  $("lead").textContent="";
  PRODS = data.products||[];
  const grid=$("grid"); grid.innerHTML="";
  SECTIONS.forEach(([key,title])=>{
    const items=PRODS.filter(p=>(p.section||"")===key);
    if(!items.length) return;
    const sec=document.createElement("div"); sec.className="sec";
    sec.innerHTML=`<h2 class="sec-h">${title}</h2><div class="tiles"></div>`;
    const tiles=sec.querySelector(".tiles");
    items.forEach(p=>{
      const el=document.createElement("div");
      const price = p.price_eur!=null ? fmtPrice(p.price_eur) : "";
      const tag = p.badge ? `<div class="lp badge">${p.badge}</div>` : (price?`<div class="lp">${price}</div>`:"");
      if(p.unlocked){
        el.className="tile open";
        const art = p.tile_image
          ? `<div class="art"><img src="${p.tile_image}" alt=""></div>`
          : `<div class="art"><span class="mono">${p.is_free?"◇":"✦"}</span></div>`;
        const tagText = "Доступно";
        const foot = `<div class="meta"><span class="open-tag">${tagText}</span><span>Открыть →</span></div>`;
        el.innerHTML = art + `<div class="body"><div class="name">${p.name_ru}</div>${foot}</div>`;
        el.onclick=()=>openItem(p.code);
      } else {
        el.className="tile locked";
        el.innerHTML = `<div class="lockcard"><div class="ln">${p.name_ru}</div>${tag}<div class="li">🔒</div><button class="openbtn" type="button">Открыть</button></div>`;
        el.querySelector(".openbtn").onclick=()=>openPurchase(p.code);
      }
      tiles.appendChild(el);
    });
    grid.appendChild(sec);
  });
  show("cabinet",true);
}

// ---- purchase request (name + email come from the signed-in account, server-side) ----
let PUR_CODE=null;
function openPurchase(code){
  const p=PRODS.find(x=>x.code===code); if(!p) return;
  PUR_CODE=code;
  $("pur-title").textContent=p.name_ru||"";
  $("pur-price").textContent = p.price_eur!=null ? fmtPrice(p.price_eur) : (p.badge||"");
  $("pur-msg").textContent=""; $("pur-msg").style.color="";
  $("pur-send").disabled=false; $("pur-send").textContent = p.badge ? "Оформить предзаказ" : "Отправить заявку";
  show("cabinet",false); show("item",false); show("loading",false); show("purchase",true);
}
window.openPurchase=openPurchase;
$("pur-back").onclick=loadCabinet;
$("pur-send").onclick=async()=>{
  if(!PUR_CODE) return;
  $("pur-send").disabled=true; $("pur-msg").style.color=""; $("pur-msg").textContent="Отправляем…";
  const { ok } = await api("/api/purchase-request",{method:"POST",body:JSON.stringify({product_code:PUR_CODE})});
  if(ok){ $("pur-msg").style.color="var(--gold2)"; $("pur-msg").textContent="Заявка отправлена. Мы свяжемся с вами по почте, чтобы принять оплату и открыть доступ."; $("pur-send").textContent="Готово"; }
  else { $("pur-send").disabled=false; $("pur-msg").textContent="Не удалось отправить заявку. Попробуйте ещё раз."; }
};

async function openItem(code){
  show("cabinet",false); show("loading",true);
  const { ok, data } = await api("/api/content?code="+encodeURIComponent(code));
  show("loading",false);
  if(!ok) return loadCabinet();
  if((!data.content_html || !data.content_html.trim()) && data.target_url){ window.open(data.target_url, "_blank", "noopener"); show("loading",false); show("cabinet",true); return; }
  $("item-title").textContent=data.name_ru||"";
  $("item-content").innerHTML = (data.content_html && data.content_html.trim())
    ? data.content_html
    : '<p class="empty">Материал скоро появится здесь.</p>';
  show("item",true);
}
$("item-back").onclick=loadCabinet;

// ---- routing ----
function route(){
  if(token()){ loadCabinet(); }
  else {
    show("loading",false); show("who",false); show("cabinet",false); show("item",false); show("purchase",false);
    $("lead").textContent="Войдите или зарегистрируйтесь, чтобы открыть свои материалы.";
    setMode("login"); show("auth",true);
  }
}
// Sign-in from an email link — two shapes handled:
//  (a) our own confirmation link  -> ?confirm=<token_hash>  -> verify + sign in
//  (b) legacy Supabase hash link  -> #access_token=...      -> pick up the session
(async function(){
  try{
    const h=new URLSearchParams(location.hash.slice(1)), at=h.get("access_token"), rt=h.get("refresh_token");
    if(at){ localStorage.setItem(AT,at); if(rt) localStorage.setItem(RT,rt); history.replaceState(null,"",location.pathname+location.search); }
  }catch(e){}
  let ctok=null; try{ ctok=new URLSearchParams(location.search).get("confirm"); }catch(e){}
  if(ctok){
    show("auth",false); show("who",false); show("cabinet",false); show("item",false); show("loading",true);
    let done=false;
    try{
      const { ok, data } = await api("/api/confirm", { method:"POST", body:JSON.stringify({ token_hash:ctok }) });
      if(ok && data.access_token){ setTokens(data); done=true; }
    }catch(e){}
    history.replaceState(null,"",location.pathname);
    route();
    if(!done){ $("msg").textContent="Ссылка подтверждения недействительна или устарела. Войдите или зарегистрируйтесь заново."; }
    return;
  }
  route();
})();
// re-render when the page is restored from the browser's back/forward cache (avoids a blank cabinet on Back)
window.addEventListener("pageshow", (e)=>{ if(e.persisted) route(); });

// back-to-top
(function(){ const b=$("backToTop"); window.addEventListener("scroll",()=>{ b.style.display = window.scrollY>400 ? "flex":"none"; }); b.onclick=(e)=>{ e.preventDefault(); window.scrollTo({top:0,behavior:"smooth"}); }; })();
</script>
