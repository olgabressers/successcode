<style>
  :root {
    --bg: #f5f3ee; --surface: #ffffff; --border: #d8d4c8;
    --gold: #b8882a; --gold-dim: #8a6410;
    --text: #1a1a1a; --text-dim: #555; --text-muted: #888;
    --el-wood:#2e7d32; --el-fire:#c62828; --el-earth:#8d6e2b; --el-metal:#607d8b; --el-water:#1565c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100vw; width: 100%; overflow-x: hidden; position: relative; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg);
         color: var(--text); min-height: 100vh; padding: 40px 24px; }
  .lang-switch { display: flex; gap: 4px; }
  .lang-switch button { width: auto; background: transparent; border: 1px solid rgba(184,144,58,0.45);
                        color: #c0c2d4; padding: 5px 11px; font-size: 11px; letter-spacing: 1px;
                        cursor: pointer; font-family: 'Inter', sans-serif; }
  .lang-switch button.on { background: #b8903a; border-color: #b8903a; color: #f5f1eb; }
  .site-nav { position: sticky; top: 0; z-index: 300; display: flex; align-items: center; gap: 16px;
    padding: 16px 24px; margin: -40px -24px 0; background: rgba(52,54,64,0.98);
    border-bottom: 1px solid rgba(184,144,58,0.25); backdrop-filter: blur(8px); flex-wrap: wrap; }
  .nl-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700;
    letter-spacing: 5px; text-transform: uppercase; color: #eceef8; text-decoration: none; }
  .nl-sections { display: flex; gap: 18px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .nl-link { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #eceef8;
    font-weight: 600; text-decoration: none; white-space: nowrap; transition: color .25s; }
  .nl-link:hover { color: #cfa44e; }
  .nl-right { display: flex; gap: 10px; align-items: center; }
  .nl-btn { width: auto; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600;
    color: #f5f1eb; background: #b8903a; padding: 9px 16px; text-decoration: none; border: 0; transition: background .25s; }
  .nl-btn:hover { background: #cfa44e; }
  .print-btn { width: auto; background: transparent; border: 1px solid rgba(184,144,58,0.45); color: #c0c2d4;
               padding: 6px 12px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
               font-family: 'Inter', sans-serif; cursor: pointer; }
  .print-btn:hover { border-color: #cfa44e; color: #cfa44e; }

  header { text-align: center; margin-bottom: 30px; padding-top: 44px; }
  header h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400;
              letter-spacing: 2px; color: var(--gold); }
  header p { font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
             color: var(--text-muted); margin-top: 6px; }

  .wrap { max-width: 980px; margin: 0 auto; width: 100%; }
  .form-panel { background: var(--surface); border: 1px solid var(--border); padding: 24px 28px; margin-bottom: 28px; }
  .section-label { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 500;
                   color: var(--gold); letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; }
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
  input, select { background: #f8f6f2; border: 1px solid var(--border); color: var(--text);
                  padding: 10px 14px; font-size: 14px; font-family: 'Inter', sans-serif;
                  outline: none; width: 100%; transition: border-color .2s; }
  input:focus { border-color: var(--gold); }
  .city-dd { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: #fff;
             border: 1px solid var(--border); border-top: none; max-height: 220px; overflow-y: auto; display: none; }
  .city-opt { padding: 8px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #eee; }
  .city-opt:hover { background: #faf7ef; }
  .hint { font-size: 11px; color: var(--gold-dim); margin-top: 4px; min-height: 14px; line-height: 1.5; }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .chk input { width: auto; }
  .chk label { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--text-dim); cursor: pointer; }
  .step-row { display: flex; gap: 6px; }
  .step-btn { width: 40px; flex: none; background: #f8f6f2; border: 1px solid var(--border);
              color: var(--gold-dim); font-size: 15px; cursor: pointer; padding: 0; }
  .step-btn:hover { border-color: var(--gold); }


  /* ---------- map ---------- */
  .map-panel { background: var(--surface); border: 1px solid var(--border); margin-bottom: 24px; }
  .map-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
              padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .map-head .section-label { margin-bottom: 0; }
  .map-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .tool-btn { width: auto; background: #f8f6f2; border: 1px solid var(--border); color: var(--text-dim);
              padding: 7px 12px; font-size: 11px; letter-spacing: .5px; text-transform: none;
              font-family: 'Inter', sans-serif; cursor: pointer; }
  .tool-btn:hover { border-color: var(--gold); color: var(--gold-dim); background: #f8f6f2; }
  .tool-btn.on { background: var(--gold); border-color: var(--gold); color: #fff; }
  #map { width: 100%; height: 560px; z-index: 1; background: #e8e4d8; }
  .map-hint { padding: 11px 18px; font-size: 12px; color: var(--text-dim);
              border-top: 1px solid var(--border); line-height: 1.6; background: #fbf8f1; }
  .map-hint b { color: var(--text); }
  #overlay { position: absolute; inset: 0; z-index: 500; pointer-events: none; }
  #overlay .grab { pointer-events: auto; cursor: grab; }
  #overlay .grab:active { cursor: grabbing; }
  .leaflet-container { font-family: 'Inter', sans-serif; }
  .readout { position: absolute; left: 12px; bottom: 12px; z-index: 600;
             background: rgba(255,255,255,.94); border: 1px solid var(--border);
             padding: 9px 14px; font-size: 12px; line-height: 1.6; color: var(--text-dim); }
  .readout b { color: var(--text); font-size: 15px; }
  .readout .mtn { font-family: 'Cormorant Garamond', serif; font-size: 21px; color: var(--gold-dim); }

  /* results */
  .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); padding: 22px 24px; }
  .card.facing { border-color: var(--gold); border-width: 2px; }
  .card-tag { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;

  .m-char { font-family: 'Cormorant Garamond', serif; font-size: 62px; line-height: 1; font-weight: 400; }
  .m-names { font-size: 15px; color: var(--text-dim); margin-top: 6px; }
  .m-names b { color: var(--text); font-weight: 600; }
  .m-rows { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .m-row { display: flex; justify-content: space-between; gap: 14px; font-size: 13px;
           color: var(--text-dim); line-height: 1.9; }
  .m-row span:first-child { color: var(--text-muted); }
  .m-row b { color: var(--text); font-weight: 600; }
  .el-wood{color:var(--el-wood)} .el-fire{color:var(--el-fire)} .el-earth{color:var(--el-earth)}
  .el-metal{color:var(--el-metal)} .el-water{color:var(--el-water)}

  .frame-note { background: #fbf8f1; border: 1px solid var(--border); border-left: 3px solid var(--gold);
                padding: 14px 18px; font-size: 13px; color: var(--text-dim); line-height: 1.7; margin-bottom: 24px; }
  .frame-note b { color: var(--text); }

  /* compass */
  .compass-wrap { background: var(--surface); border: 1px solid var(--border); padding: 24px; margin-bottom: 24px; text-align: center; }
  .compass-wrap svg { max-width: 100%; height: auto; }

  /* reference table */
  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); padding: 20px 24px; margin-bottom: 24px; overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th { text-align: left; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
       color: var(--text-muted); font-weight: 600; padding: 8px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid #eee; color: var(--text-dim); white-space: nowrap; }
  td.ch { font-family: 'Cormorant Garamond', serif; font-size: 19px; color: var(--text); }
  tr.hit td { background: #fdf8ec; color: var(--text); font-weight: 600; }
  tr.hit td.ch { color: var(--gold-dim); }

  .backnav { text-align: center; margin-top: 30px; }
  .backnav a { color: var(--gold-dim); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none; }
  .backnav a:hover { color: var(--gold); }
  .footer-brand { text-align: center; margin-top: 22px; margin-bottom: 10px;
                  font-family: 'Cormorant Garamond', serif; color: var(--text-muted); letter-spacing: 3px; font-size: 13px; }
  .src-note { text-align: center; font-size: 10.5px; color: var(--text-muted); line-height: 1.7; margin-top: 14px; }

  .back-to-top { position: fixed; bottom: 28px; right: 28px; width: 54px; height: 54px; z-index: 400;
                 background: var(--gold); display: none; align-items: center; justify-content: center;
                 text-decoration: none; opacity: .92; transition: opacity .25s, background .25s; }
  .back-to-top:hover { opacity: 1; background: var(--gold-dim); }
  .back-to-top svg { width: 22px; height: 22px; stroke: #fff; }

  @media (max-width: 700px) {
    * { max-width: 100vw; }
    img, svg, table { max-width: 100% !important; }
    body { padding: 40px 12px 24px; }
    .m-row { flex-wrap: wrap; gap: 2px 10px; line-height: 1.6; }
    .m-row b { text-align: right; }
    .frame-note { padding: 12px 14px; font-size: 12.5px; }
    .tbl-wrap { padding: 14px 10px; }
    .tbl-wrap table { min-width: 620px; }
    .step-row input { min-width: 0; }
    .site-nav { justify-content: center; gap: 9px 12px; padding: 10px 12px; margin: -40px -12px 0; }
    .nl-logo { width: 100%; text-align: center; }
    .nl-right { order: 2; width: 100%; justify-content: center; flex-wrap: wrap; }
    .nl-sections { order: 3; width: 100%; margin-left: 0; justify-content: center; gap: 10px 12px; }
    .nl-link { font-size: 10px; letter-spacing: 0.8px; }
    header h1 { font-size: 20px; letter-spacing: 1px; }
    header p { font-size: 9px; letter-spacing: 1.5px; }
    .form-panel { padding: 16px 14px; }
    .form-grid { grid-template-columns: 1fr; gap: 12px; }
    .res-grid { grid-template-columns: 1fr; gap: 14px; }
    .card { padding: 18px 16px; }
    .m-char { font-size: 50px; }
    .tbl-wrap { padding: 14px 12px; }
    .back-to-top { width: 46px; height: 46px; bottom: 18px; right: 18px; }
    #map { height: 400px; }
    .map-head { padding: 12px 12px; }
    .map-tools { margin-left: 0; width: 100%; }
    .tool-btn { flex: 1; padding: 7px 8px; font-size: 10px; }
  }
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    body { padding: 0; background: #fff; color: #000;
           -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .site-nav, .lang-switch, .print-btn, .form-panel, .city-dd, .backnav, .back-to-top,
    .map-tools, .map-hint { display: none !important; }
    header { margin-bottom: 10px; padding-top: 0; }
    .card, .compass-wrap, .tbl-wrap { break-inside: avoid; }
  }
</style>

<header>
  <h1>二十四山 · 24 Mountains</h1>

</header>

<div class="wrap">

  <div class="form-panel">
    <div class="section-label" data-i18n="inputTitle"></div>
    <div class="form-grid">
      <div class="form-group">
        <label data-i18n="degLabel"></label>
        <div class="step-row">
          <button class="step-btn" onclick="stepMountain(-1)" title="−1">‹</button>
          <input type="number" id="f-deg" step="0.1" min="0" max="360" value="0" oninput="compute()">
          <button class="step-btn" onclick="stepMountain(1)" title="+1">›</button>
        </div>
        <div class="hint" data-i18n="degHint"></div>
      </div>
      <div class="form-group">
        <label data-i18n="cityLabel"></label>
        <input type="text" id="f-city" autocomplete="off" oninput="onCityInput()">
        <div class="city-dd" id="city-dd"></div>
        <div class="hint" id="coord-hint"></div>
      </div>
      <div class="form-group">
        <label data-i18n="declLabel"></label>
        <input type="number" id="f-decl" step="0.001" value="0" oninput="onDeclEdit()">
        <div class="hint" id="decl-hint"></div>
      </div>
      <div class="form-group full">
        <div class="chk">
          <input type="checkbox" id="f-usedecl" checked onchange="compute()">
          <label for="f-usedecl" data-i18n="useDecl"></label>
        </div>
      </div>
    </div>
  </div>


  <div class="map-panel">
    <div class="map-head">
      <div class="section-label" data-i18n="mapTitle"></div>
      <div class="map-tools">
        <button class="tool-btn on" id="btn-sat"  onclick="setLayer('sat')"  data-i18n="laySat"></button>
        <button class="tool-btn"    id="btn-osm"  onclick="setLayer('osm')"  data-i18n="layOsm"></button>
        <button class="tool-btn on" id="btn-ring" onclick="toggleRing()"     data-i18n="ringBtn"></button>
        <button class="tool-btn"    id="btn-flip" onclick="flipFacing()"     data-i18n="flipBtn"></button>
      </div>
    </div>
    <div style="position:relative">
      <div id="map"></div>
      <svg id="overlay"></svg>
      <div class="readout" id="readout"></div>
    </div>
    <div class="map-hint" data-i18n="mapHint"></div>
  </div>

  <div class="frame-note" id="frame-note"></div>

  <div class="res-grid">
    <div class="card facing" id="card-facing"></div>
    <div class="card" id="card-sitting"></div>
  </div>

  <div class="compass-wrap"><div id="compass"></div></div>

  <div class="tbl-wrap">
    <div class="section-label" data-i18n="tblTitle"></div>
    <table id="m24-table"></table>
  </div>

let LANG = "ru";
try { const s = localStorage.getItem("sc-lang"); if (s === "ru" || s === "en") LANG = s; } catch (e) {}
try { const q = new URL(location.href).searchParams.get("lang"); if (q === "ru" || q === "en") LANG = q; } catch (e) {}

let LAT = 52.0907, LON = 5.1214, CITYNAME = "Utrecht";
let DECL_AUTO = true;
let _cityTimer = null;

const L = () => I18N[LANG];
const $ = id => document.getElementById(id);
const norm = d => ((d % 360) + 360) % 360;
const r1 = n => Math.round(n * 10) / 10;

/* Mountain lookup — explicit degree ranges, never an index formula.
   子 is the only mountain whose span wraps through 0°. */
function mountainAt(deg) {
  const d = norm(deg);
  for (const m of M24) {
    if (m.s <= m.e) { if (d >= m.s && d < m.e) return m; }
    else { if (d >= m.s || d < m.e) return m; }
  }
  return M24[0];
}
const mIndex = m => M24.indexOf(m);
const opposite = m => M24[(mIndex(m) + 12) % 24];
const centreOf = m => norm(m.s + 7.5);

function stepMountain(dir) {
  const cur = mountainAt(trueBearing());
  const nxt = M24[(mIndex(cur) + dir + 24) % 24];
  let t = centreOf(nxt);
  // convert the true bearing back into the displayed (compass) frame
  if ($("f-usedecl").checked) t = norm(t - declValue());
  $("f-deg").value = r1(t);
  compute();
}

const declValue = () => parseFloat($("f-decl").value) || 0;
const inputDeg  = () => norm(parseFloat($("f-deg").value) || 0);
function trueBearing() {
  return $("f-usedecl").checked ? norm(inputDeg() + declValue()) : inputDeg();
}

function refreshDeclination() {
  if (!DECL_AUTO) return;
  try {
    const d = window.magvar(LAT, LON, 0);
    if (typeof d === "number" && isFinite(d)) $("f-decl").value = Math.round(d * 1000) / 1000;
  } catch (e) {}
}
function onDeclEdit() { DECL_AUTO = false; compute(); }

function elClass(el) { return "el-" + el; }

function renderCard(box, m, tagKey) {
  const t = L();
  const secFull = LANG === "ru" ? m.secFullRu : m.secFullEn;
  const sec     = LANG === "ru" ? m.secRu     : m.secEn;
  const kind    = LANG === "ru" ? m.kRu       : m.kEn;
  const read    = LANG === "ru" ? m.ru        : m.py;
  box.innerHTML =
    '<div class="card-tag">' + t[tagKey] + '</div>' +
    '<div class="m-char ' + elClass(m.el) + '">' + m.n + '</div>' +
    '<div class="m-names"><b>' + read + '</b>' + (LANG === "ru" ? ' · ' + m.py : '') + '</div>' +
    '<div class="m-rows">' +
      row(t.range,    m.s + '° – ' + m.e + '°') +
      row(t.sector,   sec + ' · ' + secFull) +
      row(t.trigram,  m.g + ' ' + m.ge) +
      row(t.element,  '<span class="' + elClass(m.el) + '">' + t.els[m.el] + '</span>') +
      row(t.yy,       m.yy + ' ' + (m.yy === "阳" ? t.yang : t.yin)) +
      row(t.kind,     kind) +
    '</div>';
  function row(k, v) { return '<div class="m-row"><span>' + k + '</span><b>' + v + '</b></div>'; }
}

function renderCompass(trueDeg) {
  const R = 168, cx = 190, cy = 190;
  const hit = mountainAt(trueDeg);
  let s = '<svg viewBox="0 0 380 380" role="img" aria-label="24 mountains compass">';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="#fff" stroke="#d8d4c8"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R - 42) + '" fill="none" stroke="#e8e4d8"/>';
  for (const m of M24) {
    const a0 = m.s, a1 = m.s + 15;
    const p0 = pt(cx, cy, R, a0), p1 = pt(cx, cy, R, a1);
    const q0 = pt(cx, cy, R - 42, a0), q1 = pt(cx, cy, R - 42, a1);
    const isHit = m === hit;
    s += '<path d="M' + q0.x + ' ' + q0.y + ' L' + p0.x + ' ' + p0.y +
         ' A' + R + ' ' + R + ' 0 0 1 ' + p1.x + ' ' + p1.y +
         ' L' + q1.x + ' ' + q1.y +
         ' A' + (R - 42) + ' ' + (R - 42) + ' 0 0 0 ' + q0.x + ' ' + q0.y + ' Z" ' +
         'fill="' + (isHit ? "#f4e3ba" : "#fdfcf9") + '" stroke="#e0dccf"/>';
    const lp = pt(cx, cy, R - 21, a0 + 7.5);
    s += '<text x="' + lp.x + '" y="' + lp.y + '" text-anchor="middle" dominant-baseline="central" ' +
         'font-family="Cormorant Garamond, serif" font-size="' + (isHit ? 21 : 17) + '" ' +
         'fill="' + (isHit ? "#8a6410" : "#555") + '" font-weight="' + (isHit ? 700 : 400) + '">' + m.n + '</text>';
  }
  // needle at the true bearing
  const np = pt(cx, cy, R - 4, trueDeg);
  s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + np.x + '" y2="' + np.y + '" stroke="#b8882a" stroke-width="2.5"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#b8882a"/>';
  s += '<text x="' + cx + '" y="' + (cy + 52) + '" text-anchor="middle" font-family="Inter,sans-serif" ' +
       'font-size="20" font-weight="600" fill="#1a1a1a">' + r1(trueDeg) + '°</text>';
  s += '</svg>';
  $("compass").innerHTML = s;

  function pt(x, y, r, deg) {          // 0° = North = up, clockwise
    const a = (deg - 90) * Math.PI / 180;
    return { x: Math.round((x + r * Math.cos(a)) * 100) / 100,
             y: Math.round((y + r * Math.sin(a)) * 100) / 100 };
  }
}

/* ============================================================
   MAP — place the blue line along the facade; the gold arrow
   sits at 90° to it and IS the facing direction.
   The map is true-north-up, so the arrow's angle is the TRUE
   bearing. The degree box shows the compass reading
   (true − declination), matching what a luopan reads on site.
   ============================================================ */
let MAP = null, MARKER = null, LAYERS = {}, CUR_LAYER = "sat";
let WALL_DEG = 90;        // bearing of the facade line itself
let FLIP = 0;             // 0 or 180 — which side the facing arrow points
let SHOW_RING = true;
let RADIUS = 130;         // px, half-length of the facade line
const SVGNS = "http://www.w3.org/2000/svg";
/* NB: this page already uses L() as the i18n getter, which shadows Leaflet's
   global L in lexical scope. Bind Leaflet explicitly via window. */
const LEAF = window.L;

const facingDeg = () => norm(WALL_DEG - 90 + FLIP);

function initMap() {
  MAP = LEAF.map("map", { center: [LAT, LON], zoom: 19, zoomControl: true, attributionControl: true });
  LAYERS.sat = LEAF.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 21, maxNativeZoom: 19, attribution: "Esri, Maxar, Earthstar Geographics" });
  LAYERS.osm = LEAF.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 21, maxNativeZoom: 19, attribution: "© OpenStreetMap" });
  LAYERS.sat.addTo(MAP);

  MARKER = LEAF.marker([LAT, LON], { draggable: true }).addTo(MAP);
  MARKER.on("drag", drawOverlay);
  MARKER.on("dragend", function () {
    const ll = MARKER.getLatLng();
    LAT = ll.lat; LON = ll.lng;
    DECL_AUTO = true; refreshDeclination();
    compute();
  });
  MAP.on("move zoom viewreset resize", drawOverlay);
  drawOverlay();
}

function setLayer(k) {
  if (k === CUR_LAYER) return;
  MAP.removeLayer(LAYERS[CUR_LAYER]); LAYERS[k].addTo(MAP); CUR_LAYER = k;
  $("btn-sat").classList.toggle("on", k === "sat");
  $("btn-osm").classList.toggle("on", k === "osm");
}
function toggleRing() { SHOW_RING = !SHOW_RING; $("btn-ring").classList.toggle("on", SHOW_RING); drawOverlay(); }
function flipFacing() { FLIP = FLIP ? 0 : 180; syncFromMap(); }

/* map angle -> screen point. 0° = true north = up, clockwise. */
function ptAt(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function drawOverlay() {
  if (!MAP) return;
  const svg = $("overlay");
  const box = $("map").getBoundingClientRect();
  svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const p = MAP.latLngToContainerPoint(MARKER.getLatLng());
  const cx = p.x, cy = p.y;
  const fd = facingDeg();

  if (SHOW_RING) {
    const R = RADIUS + 46, RI = RADIUS + 14;
    const hit = mountainAt(fd);
    for (const m of M24) {
      const a0 = m.s, a1 = m.s + 15;
      const o0 = ptAt(cx, cy, R, a0),  o1 = ptAt(cx, cy, R, a1);
      const i0 = ptAt(cx, cy, RI, a0), i1 = ptAt(cx, cy, RI, a1);
      const on = m === hit;
      svg.appendChild(el("path", {
        d: "M" + i0[0] + " " + i0[1] + " L" + o0[0] + " " + o0[1] +
           " A" + R + " " + R + " 0 0 1 " + o1[0] + " " + o1[1] +
           " L" + i1[0] + " " + i1[1] +
           " A" + RI + " " + RI + " 0 0 0 " + i0[0] + " " + i0[1] + " Z",
        fill: on ? "rgba(244,227,186,.94)" : "rgba(255,255,255,.80)",
        stroke: "rgba(120,110,90,.5)", "stroke-width": 1 }));
      const lp = ptAt(cx, cy, (R + RI) / 2, a0 + 7.5);
      const t = el("text", { x: lp[0], y: lp[1], "text-anchor": "middle",
        "dominant-baseline": "central", "font-family": "Cormorant Garamond, serif",
        "font-size": on ? 19 : 15, "font-weight": on ? 700 : 400,
        fill: on ? "#8a6410" : "#3a3a3a" });
      t.textContent = m.n; svg.appendChild(t);
    }
  }

  // facade line (blue) with a drag handle at each end
  const w0 = ptAt(cx, cy, RADIUS, WALL_DEG);
  const w1 = ptAt(cx, cy, RADIUS, norm(WALL_DEG + 180));
  svg.appendChild(el("line", { x1: w0[0], y1: w0[1], x2: w1[0], y2: w1[1],
    stroke: "#1565c0", "stroke-width": 4, "stroke-linecap": "round", opacity: .95 }));
  [w0, w1].forEach(function (w, i) {
    const h = el("circle", { cx: w[0], cy: w[1], r: 11, fill: "#1565c0",
      stroke: "#fff", "stroke-width": 2.5, class: "grab" });
    h.addEventListener("mousedown", startRotate);
    h.addEventListener("touchstart", startRotate, { passive: false });
    svg.appendChild(h);
  });

  // facing arrow (gold), perpendicular to the facade
  const f = ptAt(cx, cy, RADIUS + 4, fd);
  svg.appendChild(el("line", { x1: cx, y1: cy, x2: f[0], y2: f[1],
    stroke: "#b8882a", "stroke-width": 4, "stroke-linecap": "round" }));
  const bl = ptAt(cx, cy, RADIUS - 12, norm(fd - 5)),
        br = ptAt(cx, cy, RADIUS - 12, norm(fd + 5));
  svg.appendChild(el("polygon", {
    points: f[0] + "," + f[1] + " " + bl[0] + "," + bl[1] + " " + br[0] + "," + br[1],
    fill: "#b8882a" }));
  // the 90° tick between facade and facing
  svg.appendChild(el("path", {
    d: "M" + ptAt(cx, cy, 34, fd)[0] + " " + ptAt(cx, cy, 34, fd)[1] +
       " A 34 34 0 0 " + (FLIP ? 0 : 1) + " " +
       ptAt(cx, cy, 34, WALL_DEG)[0] + " " + ptAt(cx, cy, 34, WALL_DEG)[1],
    fill: "none", stroke: "#b8882a", "stroke-width": 1.5, "stroke-dasharray": "3 3", opacity: .8 }));
  svg.appendChild(el("circle", { cx: cx, cy: cy, r: 4, fill: "#b8882a" }));
}

function startRotate(ev) {
  ev.preventDefault(); ev.stopPropagation();
  const box = $("map").getBoundingClientRect();
  const p = MAP.latLngToContainerPoint(MARKER.getLatLng());
  function move(e) {
    const t = e.touches ? e.touches[0] : e;
    const dx = (t.clientX - box.left) - p.x, dy = (t.clientY - box.top) - p.y;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return;
    WALL_DEG = norm(Math.atan2(dy, dx) * 180 / Math.PI + 90);
    syncFromMap();
  }
  function up() {
    window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
    window.removeEventListener("touchmove", move); window.removeEventListener("touchend", up);
  }
  window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  window.addEventListener("touchmove", move, { passive: false }); window.addEventListener("touchend", up);
}

/* map -> inputs. The arrow's angle is the TRUE bearing; the box shows the compass reading. */
function syncFromMap() {
  let shown = facingDeg();
  if ($("f-usedecl").checked) shown = norm(shown - declValue());
  $("f-deg").value = r1(shown);
  compute();
}
/* inputs -> map, without fighting the user mid-drag */
function syncFromInputs() {
  WALL_DEG = norm(trueBearing() + 90 - FLIP);
  drawOverlay();
}
function updateReadout() {
  const t = L(), fd = facingDeg(), m = mountainAt(fd);
  $("readout").innerHTML =
    t.roFacing + ": <b>" + r1(fd) + "°</b> &nbsp;<span class='mtn'>" + m.n + "</span> " +
    (LANG === "ru" ? m.ru : m.py) + "<br>" + t.roWall + ": " + r1(WALL_DEG) + "°";
}

function compute() {
  const t = L();
  const tb = trueBearing();
  const face = mountainAt(tb);
  const sit  = opposite(face);

  renderCard($("card-facing"),  face, "facing");
  renderCard($("card-sitting"), sit,  "sitting");

  const d = declValue();
  $("frame-note").innerHTML = $("f-usedecl").checked
    ? t.frameOn.replace("{c}", r1(inputDeg())).replace("{d}", d.toFixed(3))
        .replace("{dir}", d >= 0 ? t.east : t.west).replace("{t}", r1(tb))
    : t.frameOff.replace("{c}", r1(inputDeg()));

  $("decl-hint").textContent  = DECL_AUTO ? t.declAuto : t.declManual;
  $("coord-hint").textContent = t.coordHint.replace("{lat}", LAT.toFixed(4)).replace("{lon}", LON.toFixed(4));

  renderCompass(tb);
  renderTable(face);
  if (MAP) { syncFromInputs(); updateReadout(); }
}

function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-lang]").forEach(el => {
    el.style.display = el.getAttribute("data-lang") === LANG ? "" : "none";
  });
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = L()[el.getAttribute("data-i18n")] || "";
  });
  $("f-city").placeholder = L().cityPh;
  $("lang-ru").classList.toggle("on", LANG === "ru");
  $("lang-en").classList.toggle("on", LANG === "en");
  $("backToTop").setAttribute("aria-label", LANG === "ru" ? "Наверх" : "Back to top");
  const pb = document.querySelector(".print-btn");
  if (pb) pb.textContent = LANG === "ru" ? "PDF / Печать" : "PDF / Print";
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem("sc-lang", l); } catch (e) {}
  applyLang(); compute();
}

function onCityInput() {
  clearTimeout(_cityTimer);
  const q = $("f-city").value.trim();
  if (q.length < 2) { $("city-dd").style.display = "none"; return; }
  _cityTimer = setTimeout(() => fetchCities(q), 350);
}
async function fetchCities(q) {
  const dd = $("city-dd");
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=" +
                          LANG + "&limit=6&q=" + encodeURIComponent(q));
    const arr = await r.json();
    if (!arr || !arr.length) { dd.style.display = "none"; return; }
    dd._data = arr;
    dd.innerHTML = arr.map((c, i) => '<div class="city-opt" onclick="selectCity(' + i + ')">' +
                                     c.display_name + '</div>').join("");
    dd.style.display = "block";
  } catch (e) { dd.style.display = "none"; }
}
function selectCity(i) {
  const dd = $("city-dd"), c = dd._data[i];
  LAT = parseFloat(c.lat); LON = parseFloat(c.lon);   // lat is kept — the other calculators discard it
  CITYNAME = c.display_name.split(",")[0];
  $("f-city").value = CITYNAME;
  dd.style.display = "none";
  DECL_AUTO = true;
  refreshDeclination();
  if (MAP) { MAP.setView([LAT, LON], 19); MARKER.setLatLng([LAT, LON]); }
  compute();
}

(function () {
  const bt = $("backToTop");
  window.addEventListener("scroll", function () {
    bt.style.display = window.scrollY > 400 ? "flex" : "none";
  });
  bt.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();

(function () {
  $("f-city").value = CITYNAME;
  refreshDeclination();
  applyLang();
  initMap();
  syncFromInputs();
  compute();
})();
</script>
</body>
