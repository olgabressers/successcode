<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Кабинет · Управление</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root{ --black:#3a3c48; --surface:#42444e; --gold:#b8903a; --gold2:#cfa44e;
    --white:#eceef8; --muted:#c0c2d4; --border:rgba(184,144,58,0.25); }
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ max-width:100vw; overflow-x:hidden; }
  body{ background:var(--black); color:var(--white); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
  header.top{ background:rgba(52,54,64,0.98); border-bottom:1px solid var(--border); padding:18px 26px; }
  .brand{ font-family:'Cormorant Garamond',serif; font-weight:700; letter-spacing:4px; font-size:16px; text-transform:uppercase; color:#fff; text-decoration:none; }
  .brand b{ color:var(--gold2); }
  main{ max-width:720px; margin:0 auto; padding:56px 22px 90px; }
  h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:34px; margin:0 0 6px; }
  .sub{ color:var(--muted); font-size:13px; margin:0 0 30px; }
  a.hub{ font-size:12px; color:var(--gold2); text-decoration:none; }
  a.hub:hover{ color:var(--gold); }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card{ display:block; background:var(--surface); border:1px solid var(--border); padding:30px 26px; text-decoration:none; color:var(--white); transition:border-color .2s,transform .2s; }
  .card:hover{ border-color:var(--gold2); transform:translateY(-3px); }
  .card .t{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:600; margin-bottom:8px; }
  .card .d{ font-size:13px; color:var(--muted); line-height:1.6; }
  @media (max-width:640px){ .cards{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="top"><span class="brandwrap"><a class="brand" href="/ru/">SUCCESS<b>CODE</b></a><a class="brand" href="/admin/kabinet-admin.html"> · Кабинет</a></span></header>
<main>
  <h1>Управление кабинетом</h1>
  <p class="sub"><a class="hub" href="/admin/delisted.html">← админ-хаб</a></p>
  <div class="cards">
    <a class="card" href="/admin/kabinet-clients.html">
      <div class="t">Клиенты</div>
      <div class="d">База клиентов и доступы: таблица клиентов, столбцы-продукты, открытие доступа по клетке.</div>
    </a>
    <a class="card" href="/admin/kabinet-products.html">
      <div class="t">Продукты</div>
      <div class="d">Список продуктов: ссылка на страницу, цена, видимость.</div>
    </a>
  </div>
</main>
</body>
</html>
